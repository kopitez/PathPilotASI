name: Build PathPilot ASI

on:
  workflow_dispatch:
  push:
    paths:
      - 'PathPilotASI.cpp'
      - 'PathPilotASI.vcxproj'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout PathPilot
        uses: actions/checkout@v6

      - name: Checkout Plugin-SDK
        uses: actions/checkout@v6
        with:
          repository: DK22Pac/plugin-sdk
          path: plugin-sdk
          submodules: recursive

      - name: Generate Plugin-SDK solution
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          call "%PLUGIN_SDK_DIR%\tools\generate\Visual Studio.bat"

      - name: Build GTA SA Plugin-SDK library
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          set MSBUILD="C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          cd /d "%PLUGIN_SDK_DIR%"
          %MSBUILD% plugin.slnx /p:Configuration=zDebug /p:Platform="Mixed Platforms" /p:PlatformToolset=v145 /t:plugin_sa /m /verbosity:minimal

      - name: Build PathPilot
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
          set MSBUILD="C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          %MSBUILD% PathPilotASI.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v145 /m /verbosity:minimal

      - name: Verify output
        shell: cmd
        run: |
          if not exist "bin\PathPilot.asi" (
            echo PathPilot.asi was not produced.
            exit /b 1
          )
          dir "bin\PathPilot.asi"

      - name: Upload PathPilot.asi
        uses: actions/upload-artifact@v4
        with:
          name: PathPilot-ASI
          path: bin/PathPilot.asi
